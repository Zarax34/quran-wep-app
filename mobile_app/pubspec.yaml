name: quran_center_app
description: "A new Flutter project for Quran Center management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Network
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # Local Database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  logger: ^2.3.0

  # UI
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
