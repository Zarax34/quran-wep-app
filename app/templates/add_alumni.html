{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">إضافة خريج جديد</h1>
    <a href="{{ url_for('manage_alumni') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-right"></i> رجوع لإدارة الخريجين
    </a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0"><i class="fas fa-user-graduate"></i> بيانات الخريج</h5>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="name" class="form-label">اسم الخريج</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="graduation_year" class="form-label">سنة التخرج</label>
                        <input type="number" class="form-control" id="graduation_year" name="graduation_year" required>
                    </div>
                    <div class="mb-3">
                        <label for="testimonial" class="form-label">كلمة الخريج (اختياري)</label>
                        <textarea class="form-control" id="testimonial" name="testimonial" rows="4"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="photo" class="form-label">صورة الخريج (اختياري)</label>
                        <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-save"></i> حفظ الخريج
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
