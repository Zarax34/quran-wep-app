{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">تعديل العمل</h1>
    <a href="{{ url_for('main.manage_work') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-right"></i> رجوع لإدارة الأعمال
    </a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0"><i class="fas fa-edit"></i> تفاصيل العمل</h5>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="title" class="form-label">عنوان العمل</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ work_item.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">وصف العمل</label>
                        <textarea class="form-control" id="description" name="description" rows="5" required>{{ work_item.description }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="link" class="form-label">رابط العمل (اختياري)</label>
                        <input type="url" class="form-control" id="link" name="link" value="{{ work_item.link }}">
                    </div>
                    <div class="mb-3">
                        <label for="image" class="form-label">صورة العمل (اختياري)</label>
                        <input type="file" class="form-control" id="image" name="image" accept="image/*">
                        {% if work_item.image %}
                        <div class="mt-2">
                            <img src="{{ url_for('main.uploaded_file', filename=work_item.image) }}" alt="{{ work_item.title }}" style="max-width: 200px; border-radius: 5px;">
                        </div>
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-save"></i> حفظ التعديلات
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
