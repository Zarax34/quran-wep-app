{% extends "base.html" %}

{% block content %}
<div class="page-transition">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">تعديل التقرير</h1>
        <a href="@{/reports}" class="btn btn-secondary">
            <i class="fas fa-arrow-right"></i> رجوع للتقارير
        </a>
    </div>

    <div class="row justify-content-center fade-in">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0"><i class="fas fa-edit"></i> تعديل التقرير</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="date" class="form-label">التاريخ</label>
                                    <input type="date" class="form-control" id="date" name="date"
                                           value="{{ report.date.strftime('%Y-%m-%d') }}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">الطالب</label>
                                    <p class="form-control-plaintext">{{ report.student.name }}</p>
                                </div>
                            </div>
                        </div>
                    <div class="row">
                        <div class="col-md-12">
                            <div class="mb-3">
                                <label for="page_number" class="form-label">رقم الصفحة</label>
                                <input type="text" class="form-control" id="page_number" name="page_number" readonly>
                            </div>
                        </div>
                    </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="surah" class="form-label">السورة</label>
                                    <select class="form-control" id="surah" name="surah" required>
                                        <option value="">اختر السورة</option>
                                        {% for surah in surah_names %}
                                        <option value="{{ surah }}" {% if report.surah == surah %}selected{% endif %}>{{ surah }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="from_verse" class="form-label">من الآية</label>
                                    <select class="form-control" id="from_verse" name="from_verse" required>
                                        <option value="">اختر السورة أولاً</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label for="to_verse" class="form-label">إلى الآية</label>
                                    <select class="form-control" id="to_verse" name="to_verse" required>
                                        <option value="">اختر السورة أولاً</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="type" class="form-label">نوع التسميع</label>
                                    <select class="form-control" id="type" name="type" required>
                                        <option value="حفظ" {% if report.type == 'حفظ' %}selected{% endif %}>حفظ</option>
                                        <option value="مراجعة" {% if report.type == 'مراجعة' %}selected{% endif %}>مراجعة</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="grade" class="form-label">التقدير</label>
                                    <select class="form-control" id="grade" name="grade" required>
                                        <option value="ممتاز" {% if report.grade == 'ممتاز' %}selected{% endif %}>ممتاز</option>
                                        <option value="جيد جدا" {% if report.grade == 'جيد جدا' %}selected{% endif %}>جيد جدا</option>
                                        <option value="جيد" {% if report.grade == 'جيد' %}selected{% endif %}>جيد</option>
                                        <option value="مقبول" {% if report.grade == 'مقبول' %}selected{% endif %}>مقبول</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="notes" class="form-label">ملاحظات</label>
                                    <input type="text" class="form-control" id="notes" name="notes"
                                           value="{{ report.notes or '' }}">
                                </div>
                            </div>
                        </div>

                        <div class="alert alert-info">
                            <h6><i class="fas fa-info-circle"></i> ملاحظة:</h6>
                            <p class="mb-0">سيتم تحديث التقرير فور حفظ التعديلات. يمكنك تعديل أي حقل من الحقول أعلاه.</p>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="@{/reports}" class="btn btn-secondary me-md-2">إلغاء</a>
                            <button type="submit" class="btn btn-success">حفظ التعديلات</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var surahName = document.getElementById('surah').value;
    var fromVerse = document.getElementById('from_verse');
    var toVerse = document.getElementById('to_verse');
    var pageNumber = document.getElementById('page_number');
    var currentFromVerse = "{{ report.from_verse }}";
    var currentToVerse = "{{ report.to_verse }}";

    function populateVerses(selectedSurah) {
        if (selectedSurah) {
            fetch('/api/get_surah_details?surah=' + selectedSurah)
                .then(response => response.json())
                .then(data => {
                    if (data.verse_count) {
                        fromVerse.innerHTML = '<option value="">اختر آية</option>';
                        toVerse.innerHTML = '<option value="">اختر آية</option>';
                        for (var i = 1; i <= data.verse_count; i++) {
                            fromVerse.innerHTML += '<option value="' + i + '"' + (i == currentFromVerse ? ' selected' : '') + '>' + i + '</option>';
                            toVerse.innerHTML += '<option value="' + i + '"' + (i == currentToVerse ? ' selected' : '') + '>' + i + '</option>';
                        }
                    }
                });
        }
    }

    // Populate verses on page load
    populateVerses(surahName);

    // Repopulate on surah change
    document.getElementById('surah').addEventListener('change', function() {
        currentFromVerse = null; // Reset selection
        currentToVerse = null;
        populateVerses(this.value);
    });

    document.getElementById('from_verse').addEventListener('change', function() {
        var surahName = document.getElementById('surah').value;
        var verseNumber = this.value;
        var pageNumber = document.getElementById('page_number');

        if (surahName && verseNumber) {
            fetch('/api/get_page_number?surah=' + surahName + '&verse=' + verseNumber)
                .then(response => response.json())
                .then(data => {
                    if (data.page_number) {
                        pageNumber.value = data.page_number;
                    } else {
                        pageNumber.value = 'غير متوفر';
                    }
                });
        }
    });
});
</script>
{% endblock %}
