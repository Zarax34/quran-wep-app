<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
<head>
    <title>لوحة التحكم</title>
    <style>
    .stat-card {
      width: 100%;
      height: 200px;
      background: #243137;
      position: relative;
      display: grid;
      place-content: center;
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.5s ease-in-out;
    }

    .stat-card .logo i {
        color: #bd9f67;
    }

    .stat-card .border {
      position: absolute;
      inset: 0px;
      border: 2px solid #bd9f67;
      opacity: 0;
      transform: rotate(10deg);
      transition: all 0.5s ease-in-out;
    }

    .stat-card .bottom-text {
      position: absolute;
      left: 50%;
      bottom: 13px;
      transform: translateX(-50%);
      font-size: 1.5rem;
      text-transform: uppercase;
      padding: 0px 5px 0px 8px;
      color: #bd9f67;
      background: #243137;
      opacity: 0;
      letter-spacing: 7px;
      transition: all 0.5s ease-in-out;
    }

    .stat-card .content {
      transition: all 0.5s ease-in-out;
    }

    .stat-card .content .logo {
      height: 35px;
      position: relative;
      width: 33px;
      overflow: hidden;
      transition: all 1s ease-in-out;
    }

    .stat-card .content .logo-bottom-text {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      margin-top: 30px;
      color: #bd9f67;
      padding-left: 8px;
      font-size: 1rem;
      opacity: 0;
      letter-spacing: none;
      transition: all 0.5s ease-in-out 0.5s;
    }

    .stat-card:hover {
      border-radius: 0;
      transform: scale(1.1);
    }

    .stat-card:hover .logo {
      width: 134px;
      animation: opacity 1s ease-in-out;
    }

    .stat-card:hover .border {
      inset: 15px;
      opacity: 1;
      transform: rotate(0);
    }

    .stat-card:hover .bottom-text {
      letter-spacing: 3px;
      opacity: 1;
      transform: translateX(-50%);
    }

    .stat-card:hover .content .logo-bottom-text {
      opacity: 1;
      letter-spacing: 9.5px;
    }

    /* From Uiverse.io by Smit-Prajapati */
    .student-card {
        width: 230px;
        border-radius: 20px;
        background: #1b233d;
        padding: 5px;
        overflow: hidden;
        box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 20px 0px;
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .student-card:hover {
        transform: scale(1.05);
    }
    .student-card .top-section {
        height: 150px;
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        background: linear-gradient(45deg, rgb(4, 159, 187) 0%, rgb(80, 246, 255) 100%);
        position: relative;
    }
    .student-card .top-section .border {
        border-bottom-right-radius: 10px;
        height: 30px;
        width: 130px;
        background: #1b233d;
        position: relative;
        transform: skew(-40deg);
        box-shadow: -10px -10px 0 0 #1b233d;
    }
    .student-card .top-section .border::before {
        content: "";
        position: absolute;
        width: 15px;
        height: 15px;
        top: 0;
        right: -15px;
        background: rgba(255, 255, 255, 0);
        border-top-left-radius: 10px;
        box-shadow: -5px -5px 0 2px #1b233d;
    }
    .student-card .top-section::before {
        content: "";
        position: absolute;
        top: 30px;
        left: 0;
        background: rgba(255, 255, 255, 0);
        height: 15px;
        width: 15px;
        border-top-left-radius: 15px;
        box-shadow: -5px -5px 0 2px #1b233d;
    }
    .student-card .bottom-section {
        margin-top: 15px;
        padding: 10px 5px;
    }
    .student-card .bottom-section .title {
        display: block;
        font-size: 17px;
        font-weight: bolder;
        color: white;
        text-align: center;
        letter-spacing: 2px;
    }
    .student-card .bottom-section .row {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
    }
    .student-card .bottom-section .row .item {
        flex: 30%;
        text-align: center;
        padding: 5px;
        color: rgba(170, 222, 243, 0.721);
    }
    .student-card .bottom-section .row .item .big-text {
        font-size: 12px;
        display: block;
    }
    .student-card .bottom-section .row .item .regular-text {
        font-size: 9px;
    }
    .student-card .bottom-section .row .item:nth-child(2) {
        border-left: 1px solid rgba(255, 255, 255, 0.126);
        border-right: 1px solid rgba(255, 255, 255, 0.126);
    }

    .main-card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
    }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="page-transition">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">مرحباً <span th:text="${session.name}">User</span> 👋</h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <span class="badge bg-primary fs-6" th:text="${session.role}">Role</span>
            </div>
        </div>

        <!-- Quick Stats -->
        <div class="row mb-4 fade-in">
            <div class="col-xl-3 col-md-6 mb-4">
                <div class="card stat-card">
                    <div class="content">
                        <div class="logo">
                            <i class="fas fa-user-graduate fa-2x"></i>
                        </div>
                        <div class="logo-bottom-text">إجمالي الطلاب</div>
                    </div>
                    <div class="bottom-text counter" th:attr="data-target=${total_students}">0</div>
                    <div class="border"></div>
                </div>
            </div>

            <div class="col-xl-3 col-md-6 mb-4">
                <div class="card stat-card">
                    <div class="content">
                         <div class="logo">
                            <i class="fas fa-chalkboard-teacher fa-2x"></i>
                        </div>
                        <div class="logo-bottom-text">إجمالي المعلمين</div>
                    </div>
                    <div class="bottom-text counter" th:attr="data-target=${total_teachers}">0</div>
                    <div class="border"></div>
                </div>
            </div>

            <div class="col-xl-3 col-md-6 mb-4">
                <div class="card stat-card">
                    <div class="content">
                         <div class="logo">
                            <i class="fas fa-users fa-2x"></i>
                        </div>
                        <div class="logo-bottom-text">عدد الحلقات</div>
                    </div>
                    <div class="bottom-text counter" th:attr="data-target=${total_circles}">0</div>
                    <div class="border"></div>
                </div>
            </div>

            <div class="col-xl-3 col-md-6 mb-4">
                <div class="card stat-card">
                     <div class="content">
                         <div class="logo">
                            <i class="fas fa-clipboard-list fa-2x"></i>
                        </div>
                        <div class="logo-bottom-text">التقارير اليوم</div>
                    </div>
                    <div class="bottom-text counter" th:attr="data-target=${#lists.size(recent_reports)}">0</div>
                    <div class="border"></div>
                </div>
            </div>
        </div>

        <!-- Placeholder for Charts/Actions (Simplified) -->
        <div class="row">
             <div class="col-12 text-center py-5">
                 <p class="text-muted">تم تفعيل لوحة التحكم بنجاح.</p>
             </div>
        </div>
    </div>
</div>
</body>
</html>
