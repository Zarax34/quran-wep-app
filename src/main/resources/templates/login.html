<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'تسجيل الدخول - ' + ${settings.siteName}">تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style th:inline="css">
        :root {
            --primary-color: [[${settings.primaryColor != null ? settings.primaryColor : '#D32F2F'}]];
            --secondary-color: [[${settings.secondaryColor != null ? settings.secondaryColor : '#2E7D32'}]];
            --input-bg: rgba(255, 255, 255, 0.9);
            --text-color: #ffffff;
        }

        body {
            background-color: var(--primary-color);
            background-image: repeating-linear-gradient(
                45deg,
                var(--secondary-color) 0,
                var(--secondary-color) 5px,
                transparent 5px,
                transparent 10px
            );
            background-size: 15px 15px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            color: var(--text-color);
            text-align: center;
        }

        .logo {
            max-height: 120px;
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .form-control, .btn {
            border-radius: 50px;
            border: none;
            padding: 15px 25px;
            font-size: 1.1rem;
            margin-bottom: 20px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-control {
            background-color: var(--input-bg);
            color: #333;
        }

        .form-control::placeholder {
            color: #999;
        }

        .btn-login {
            background-color: #fff;
            color: var(--primary-color);
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: scale(1.05);
        }

        .login-links {
            margin-top: 20px;
        }

        .login-links a {
            color: #ffcdd2; /* Light red for visibility */
            text-decoration: none;
            margin: 0 10px;
            transition: opacity 0.2s;
        }

        .login-links a:hover {
            opacity: 0.8;
        }

        .alert {
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div th:if="${settings.logo != null}">
            <img th:src="@{'/uploads/' + ${settings.logo}}" class="logo" th:alt="${settings.siteName}">
        </div>
        <div th:unless="${settings.logo != null}">
            <h1 class="mb-4" th:text="${settings.siteName}">اسم الموقع</h1>
        </div>

        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show">
            اسم المستخدم أو كلمة المرور غير صحيحة
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show">
            تم تسجيل الخروج بنجاح
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/login}" method="POST">
            <div class="mb-3">
                <input type="text" class="form-control" name="username" placeholder="اسم المستخدم" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="كلمة المرور" required>
            </div>
            <button type="submit" class="btn btn-login">تسجيل الدخول</button>
        </form>

        <div class="login-links">
            <a th:href="@{/support}">نسيت كلمة المرور</a>
            <span>|</span>
            <a th:href="@{/guest_dashboard}">الدخول كضيف</a>
        </div>

        <div class="alert alert-info mt-4" role="alert" style="border-radius: 15px; font-size: 0.9rem; background-color: rgba(255, 255, 255, 0.9); color: #333;">
            <i class="fas fa-info-circle me-2"></i>
            <p class="mb-0">ملاحظة لأولياء الأمور: يتم إنشاء حسابك تلقائيًا عند تسجيل ابنك/ابنتك. اسم المستخدم وكلمة المرور هما رقم الهاتف المسجل. للتسجيل لأول مرة، يرجى التواصل مع إدارة المركز.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
