version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: quran_center_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: quran_center
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: quran_center_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mysql+pymysql://user:pass@db:3306/quran_center
      - FLASK_APP=app.py
      - FLASK_DEBUG=1
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  db_data:
