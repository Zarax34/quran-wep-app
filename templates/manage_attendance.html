{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="fas fa-clipboard-check"></i> تسجيل الحضور والغياب للدورة: {{ course.name }}</h1>
    <a href="{{ url_for('course_details', course_id=course.id) }}" class="btn btn-secondary">
        <i class="fas fa-arrow-right"></i> رجوع لتفاصيل الدورة
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="date" class="form-label">تاريخ اليوم</label>
                    <input type="date" class="form-control" id="date" name="date" value="{{ date.strftime('%Y-%m-%d') }}" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">عرض الطلاب</button>
                </div>
            </div>
        </form>
    </div>
</div>

{% if students %}
<div class="card mt-4 shadow-sm">
    <div class="card-header">
        <h5 class="card-title mb-0">قائمة الطلاب المسجلين</h5>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('manage_attendance', course_id=course.id) }}">
            <input type="hidden" name="date" value="{{ date.strftime('%Y-%m-%d') }}">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>الطالب</th>
                            <th>الحالة</th>
                            <th>ملاحظات</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in students %}
                        <tr>
                            <td>{{ student.name }}</td>
                            <td>
                                <select name="status_{{ student.id }}" class="form-select">
                                    <option value="حاضر" {% if attendance_data.get(student.id) and attendance_data[student.id].status == 'حاضر' %}selected{% endif %}>حاضر</option>
                                    <option value="غائب" {% if attendance_data.get(student.id) and attendance_data[student.id].status == 'غائب' %}selected{% endif %}>غائب</option>
                                </select>
                            </td>
                            <td>
                                <input type="text" name="notes_{{ student.id }}" class="form-control" value="{{ attendance_data.get(student.id).notes if attendance_data.get(student.id) else '' }}">
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <div class="mt-3 text-end">
                <button type="submit" name="save_attendance" value="1" class="btn btn-success">
                    <i class="fas fa-save"></i> حفظ سجل الحضور
                </button>
            </div>
        </form>
    </div>
</div>
{% endif %}
{% endblock %}
