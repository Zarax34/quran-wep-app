{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">إضافة رسوم جديدة</h1>
    <a href="{{ url_for('fees') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-right"></i> الرجوع إلى سجل الرسوم
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0"><i class="fas fa-plus-circle"></i> بيانات الرسوم</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="student_id" class="form-label">الطالب</label>
                        <select class="form-control" id="student_id" name="student_id" required>
                            <option value="">اختر الطالب</option>
                            {% for student in students %}
                            <option value="{{ student.id }}">{{ student.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="amount" class="form-label">المبلغ</label>
                        <input type="number" step="0.01" class="form-control" id="amount" name="amount" required>
                    </div>
                    <div class="mb-3">
                        <label for="date_paid" class="form-label">تاريخ الدفع</label>
                        <input type="date" class="form-control" id="date_paid" name="date_paid" value="{{ now().strftime('%Y-%m-%d') }}" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="month_select" class="form-label">الشهر (اختياري)</label>
                            <select class="form-select" id="month_select" name="month_select">
                                <option value="">اختر الشهر</option>
                                <option value="يناير">يناير</option>
                                <option value="فبراير">فبراير</option>
                                <option value="مارس">مارس</option>
                                <option value="أبريل">أبريل</option>
                                <option value="مايو">مايو</option>
                                <option value="يونيو">يونيو</option>
                                <option value="يوليو">يوليو</option>
                                <option value="أغسطس">أغسطس</option>
                                <option value="سبتمبر">سبتمبر</option>
                                <option value="أكتوبر">أكتوبر</option>
                                <option value="نوفمبر">نوفمبر</option>
                                <option value="ديسمبر">ديسمبر</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="fee_name" class="form-label">اسم الرسوم (اختياري)</label>
                            <input type="text" class="form-control" id="fee_name" name="fee_name" placeholder="مثال: رسوم رحلة">
                            <div class="form-text">إذا اخترت الشهر ولم تكتب اسماً، سيتم تسميتها "رسوم شهر X" تلقائياً.</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="notes" class="form-label">ملاحظات</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('fees') }}" class="btn btn-secondary me-md-2">إلغاء</a>
                        <button type="submit" class="btn btn-success">إضافة الرسوم</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
