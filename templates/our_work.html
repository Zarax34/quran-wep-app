{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">أعمالنا</h1>
</div>

<div class="row">
    {% for work in work_list %}
    <div class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100">
            {% if work.image %}
            <img src="{{ url_for('uploaded_file', filename=work.image) }}" class="card-img-top" alt="{{ work.title }}">
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ work.title }}</h5>
                <p class="card-text">{{ work.description }}</p>
            </div>
            {% if work.link %}
            <div class="card-footer text-center">
                <a href="{{ work.link }}" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-external-link-alt"></i> مشاهدة العمل
                </a>
            </div>
            {% endif %}
        </div>
    </div>
    {% else %}
    <div class="col">
        <div class="alert alert-info">لا توجد أعمال لعرضها حالياً.</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
