<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - {{ settings.site_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: {{ settings.primary_color or '#D32F2F' }}; /* Default to red */
            --secondary-color: {{ settings.secondary_color or '#2E7D32' }}; /* Default to green */
            --input-bg: rgba(255, 255, 255, 0.9);
            --text-color: #ffffff;
        }

        body {
            background-color: var(--primary-color);
            background-image: repeating-linear-gradient(
                45deg,
                var(--secondary-color) 0,
                var(--secondary-color) 5px,
                transparent 5px,
                transparent 10px
            );
            background-size: 15px 15px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Tajawal', sans-serif;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            color: var(--text-color);
            text-align: center;
        }

        .logo {
            max-height: 120px;
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .form-control, .btn {
            border-radius: 50px;
            border: none;
            padding: 15px 25px;
            font-size: 1.1rem;
            margin-bottom: 20px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-control {
            background-color: var(--input-bg);
            color: #333;
        }

        .form-control::placeholder {
            color: #999;
        }

        .btn-login {
            background-color: #fff;
            color: var(--primary-color);
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: scale(1.05);
        }

        .login-links {
            margin-top: 20px;
        }

        .login-links a {
            color: #ffcdd2; /* Light red for visibility */
            text-decoration: none;
            margin: 0 10px;
            transition: opacity 0.2s;
        }

        .login-links a:hover {
            opacity: 0.8;
        }

        .alert {
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        {% if settings.logo %}
            <img src="{{ url_for('uploaded_file', filename=settings.logo) }}" class="logo" alt="{{ settings.site_name }}">
        {% else %}
            <h1 class="mb-4">{{ settings.site_name }}</h1>
        {% endif %}

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <input type="text" class="form-control" name="username" placeholder="اسم المستخدم" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="كلمة المرور" required>
            </div>
            <button type="submit" class="btn btn-login">تسجيل الدخول</button>
        </form>

        <div class="login-links">
            <a href="{{ url_for('support') }}">نسيت كلمة المرور</a>
            <span>|</span>
            <a href="{{ url_for('guest_dashboard') }}">الدخول كضيف</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
