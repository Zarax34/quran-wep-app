{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">إدارة الرسوم</h1>
    <a href="{{ url_for('add_fee') }}" class="btn btn-success">
        <i class="fas fa-plus-circle"></i> إضافة رسوم جديدة
    </a>
</div>

<div class="card">
    <div class="card-header">
        <h5 class="card-title mb-0"><i class="fas fa-money-bill-wave"></i> سجل الرسوم</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>الطالب</th>
                        <th>المبلغ</th>
                        <th>تاريخ الدفع</th>
                        <th>ملاحظات</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    {% for fee in fees %}
                    <tr>
                        <td>{{ fee.student.name }}</td>
                        <td>{{ fee.amount }}</td>
                        <td>{{ fee.date_paid.strftime('%Y-%m-%d') }}</td>
                        <td>{{ fee.notes }}</td>
                        <td>
                            <a href="{{ url_for('edit_fee', fee_id=fee.id) }}" class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-edit"></i> تعديل
                            </a>
                            <form action="{{ url_for('delete_fee', fee_id=fee.id) }}" method="POST" class="d-inline" onsubmit="return confirm('هل أنت متأكد من حذف هذا السجل؟');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="fas fa-trash-alt"></i> حذف
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
