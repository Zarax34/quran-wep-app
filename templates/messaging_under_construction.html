{% extends "base.html" %}

{% block title %}المراسلة - قيد التطوير{% endblock %}

        <i class="fas fa-tools fa-5x text-secondary mb-4"></i>

        <a href="{{ url_for('student_dashboard') }}" class="btn btn-primary mt-3">
