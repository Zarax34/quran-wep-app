{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">إضافة خطة شهرية للطالب: {{ student.name }}</h1>
    <a href="{{ url_for('students') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-right"></i> رجوع للطلاب
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0"><i class="fas fa-calendar-plus"></i> تفاصيل الخطة</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="start_date" class="form-label">تاريخ البداية</label>
                                <input type="date" class="form-control" id="start_date" name="start_date" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="end_date" class="form-label">تاريخ النهاية</label>
                                <input type="date" class="form-control" id="end_date" name="end_date" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="plan_type" class="form-label">نوع الخطة</label>
                        <select class="form-control" id="plan_type" name="plan_type">
                            <option value="حفظ">حفظ</option>
                            <option value="مراجعة">مراجعة</option>
                        </select>
                    </div>

                    <hr>
                    <h6>نطاق الخطة (اختياري إذا تم تحديد عدد الصفحات اليومي)</h6>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="start_surah" class="form-label">من سورة</label>
                                <select class="form-control" id="start_surah" name="start_surah">
                                    <option value="">اختر السورة</option>
                                    {% for surah in surah_names %}
                                    <option value="{{ surah }}">{{ surah }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="start_verse" class="form-label">من آية</label>
                                <input type="number" class="form-control" id="start_verse" name="start_verse">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="end_surah" class="form-label">إلى سورة</label>
                                <select class="form-control" id="end_surah" name="end_surah">
                                    <option value="">اختر السورة</option>
                                    {% for surah in surah_names %}
                                    <option value="{{ surah }}">{{ surah }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="end_verse" class="form-label">إلى آية</label>
                                <input type="number" class="form-control" id="end_verse" name="end_verse">
                            </div>
                        </div>
                    </div>

                    <hr>
                    <div class="mb-3">
                        <label for="daily_pages" class="form-label">المطلوب يومياً (عدد الصفحات)</label>
                        <input type="number" step="0.5" class="form-control" id="daily_pages" name="daily_pages" placeholder="أتركه فارغاً ليقوم النظام بالحساب بناءً على النطاق">
                        <div class="form-text">سيقوم النظام بحساب الكمية تلقائياً إذا تم تحديد البداية والنهاية، مع مراعاة عطلة الجمعة.</div>
                    </div>

                    <div class="mb-3">
                        <label for="notes" class="form-label">ملاحظات</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary">حفظ الخطة</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
