{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="fas fa-edit"></i> تعديل الدورة: {{ course.name }}</h1>
    <a href="{{ url_for('courses') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-right"></i> الرجوع للدورات
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">تعديل بيانات الدورة</h5>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="name" class="form-label">اسم الدورة</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ course.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">وصف الدورة (اختياري)</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ course.description or '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="start_date" class="form-label">تاريخ البدء</label>
                            <input type="date" class="form-control" id="start_date" name="start_date" value="{{ course.start_date.strftime('%Y-%m-%d') if course.start_date else '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="end_date" class="form-label">تاريخ الانتهاء</label>
                            <input type="date" class="form-control" id="end_date" name="end_date" value="{{ course.end_date.strftime('%Y-%m-%d') if course.end_date else '' }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="fee" class="form-label">رسوم الدورة (اختياري)</label>
                        <input type="number" step="0.01" class="form-control" id="fee" name="fee" value="{{ course.fee or 0 }}">
                    </div>

                    <div class="mb-3">
                        <label for="program_description" class="form-label">برنامج الدورة (اختياري)</label>
                        <textarea class="form-control" id="program_description" name="program_description" rows="4">{{ course.program_description or '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="image" class="form-label">تغيير صورة الدورة (اختياري)</label>
                        {% if course.image %}
                            <p>الصورة الحالية: <a href="{{ url_for('uploaded_file', filename=course.image) }}" target="_blank">{{ course.image }}</a></p>
                        {% endif %}
                        <input class="form-control" type="file" id="image" name="image" accept="image/*">
                    </div>

                    {% if session.role == 'admin' %}
                    <div class="mb-3">
                        <label for="teacher_id" class="form-label">المعلم المسؤول</label>
                        <select class="form-select" id="teacher_id" name="teacher_id" required>
                            {% for teacher in teachers %}
                            <option value="{{ teacher.id }}" {% if teacher.id == course.teacher_id %}selected{% endif %}>{{ teacher.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="status" class="form-label">حالة الدورة</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="نشطة" {% if course.status == 'نشطة' %}selected{% endif %}>نشطة</option>
                            <option value="مكتملة" {% if course.status == 'مكتملة' %}selected{% endif %}>مكتملة</option>
                        </select>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('courses') }}" class="btn btn-secondary me-md-2">إلغاء</a>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> حفظ التعديلات
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
