{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">إضافة تقرير فردي</h1>
    <a href="{{ url_for('collective_report') }}" class="btn btn-success">
        <i class="fas fa-users"></i> التقرير الجماعي
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0"><i class="fas fa-plus-circle"></i> بيانات التقرير</h5>
            </div>
            <div class="card-body">
                <form method="POST" id="addReportForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="student_id" class="form-label">الطالب</label>
                                <select class="form-control" id="student_id" name="student_id" required>
                                    <option value="">اختر الطالب</option>
                                    {% for student in students %}
                                    <option value="{{ student.id }}">{{ student.name }} - {{ student.circle.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="date" class="form-label">التاريخ</label>
                                <input type="date" class="form-control" id="date" name="date" 
                                       value="{{ now().strftime('%Y-%m-%d') }}">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="attendance_status" class="form-label">حالة الحضور</label>
                                <select class="form-control" id="attendance_status" name="attendance_status">
                                    <option value="حاضر">حاضر</option>
                                    <option value="غائب بعذر">غائب بعذر</option>
                                    <option value="غائب بلا عذر">غائب بلا عذر</option>
                                    <option value="متأخر">متأخر</option>
                                    <option value="هروب">هروب</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="page_number" class="form-label">رقم الصفحة</label>
                                <input type="text" class="form-control" id="page_number" name="page_number" readonly>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="surah" class="form-label">السورة</label>
                                <select class="form-control" id="surah" name="surah" required>
                                    <option value="">اختر السورة</option>
                                    {% for surah in surah_names %}
                                    <option value="{{ surah }}">{{ surah }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="mb-3">
                                <label for="from_verse" class="form-label">من الآية</label>
                                <select class="form-control" id="from_verse" name="from_verse" required>
                                    <option value="">اختر السورة أولاً</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="mb-3">
                                <label for="to_verse" class="form-label">إلى الآية</label>
                                <select class="form-control" id="to_verse" name="to_verse" required>
                                    <option value="">اختر السورة أولاً</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="type" class="form-label">نوع التسميع</label>
                                <select class="form-control" id="type" name="type" required>
                                    <option value="حفظ">حفظ</option>
                                    <option value="مراجعة">مراجعة</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="grade" class="form-label">التقدير</label>
                                <select class="form-control" id="grade" name="grade" required>
                                    <option value="ممتاز">ممتاز</option>
                                    <option value="جيد جدا">جيد جدا</option>
                                    <option value="جيد">جيد</option>
                                    <option value="مقبول">مقبول</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="notes" class="form-label">ملاحظات</label>
                                <input type="text" class="form-control" id="notes" name="notes" 
                                       placeholder="ملاحظات إضافية">
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('reports') }}" class="btn btn-secondary me-md-2">إلغاء</a>
                        <button type="submit" class="btn btn-success">إضافة التقرير</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Function to fetch and update the page number
function updatePageNumber() {
    var surahName = document.getElementById('surah').value;
    var verseNumber = document.getElementById('from_verse').value; // Always use from_verse for page number
    var pageNumberInput = document.getElementById('page_number');

    if (surahName && verseNumber) {
        fetch('/api/get_page_number?surah=' + surahName + '&verse=' + verseNumber)
            .then(response => response.json())
            .then(data => {
                if (data.page_number) {
                    pageNumberInput.value = data.page_number;
                } else {
                    pageNumberInput.value = 'غير متوفر';
                }
            })
            .catch(error => {
                console.error('Error fetching page number:', error);
                pageNumberInput.value = 'خطأ';
            });
    } else {
        pageNumberInput.value = ''; // Clear if no surah/verse is selected
    }
}

// Listener for the Surah dropdown to populate verse dropdowns
document.getElementById('surah').addEventListener('change', function() {
    var surahName = this.value;
    var fromVerse = document.getElementById('from_verse');
    var toVerse = document.getElementById('to_verse');
    var pageNumber = document.getElementById('page_number');

    fromVerse.innerHTML = '<option value="">...</option>';
    toVerse.innerHTML = '<option value="">...</option>';
    pageNumber.value = '';

    if (surahName) {
        fetch('/api/get_surah_details?surah=' + encodeURIComponent(surahName))
            .then(response => response.json())
            .then(data => {
                if (data.verse_count) {
                    fromVerse.innerHTML = '<option value="">اختر آية</option>';
                    toVerse.innerHTML = '<option value="">اختر آية</option>';
                    for (var i = 1; i <= data.verse_count; i++) {
                        fromVerse.innerHTML += '<option value="' + i + '">' + i + '</option>';
                        toVerse.innerHTML += '<option value="' + i + '">' + i + '</option>';
                    }
                }
            });
    }
});

// Use event delegation on the form for verse changes
document.getElementById('addReportForm').addEventListener('change', function(event) {
    if (event.target.id === 'from_verse' || event.target.id === 'to_verse') {
        updatePageNumber();
    }
});


document.getElementById('addReportForm').addEventListener('submit', function(event) {
    var student = document.getElementById('student_id').value;
    var surah = document.getElementById('surah').value;
    var fromVerse = document.getElementById('from_verse').value;
    var toVerse = document.getElementById('to_verse').value;

    if (!student || !surah || !fromVerse || !toVerse) {
        if (!confirm('بعض الحقول فارغة. هل تريد المتابعة على أي حال؟')) {
            event.preventDefault();
        }
    }
});
</script>
{% endblock %}
