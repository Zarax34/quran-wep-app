{% extends "base.html" %}

{% block content %}
<div class="page-transition">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">تعديل بيانات الخريج</h1>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">تعديل بيانات {{ graduate.name }}</h5>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="name" class="form-label">الاسم</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ graduate.name }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="graduation_year" class="form-label">سنة التخرج</label>
                            <input type="number" class="form-control" id="graduation_year" name="graduation_year" value="{{ graduate.graduation_year }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="achievements" class="form-label">الإنجازات</label>
                            <textarea class="form-control" id="achievements" name="achievements" rows="3">{{ graduate.achievements }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="photo" class="form-label">الصورة</label>
                            <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
                            {% if graduate.photo %}
                            <img src="{{ url_for('uploaded_file', filename=graduate.photo) }}" width="100" class="mt-2">
                            {% endif %}
                        </div>
                        <button type="submit" class="btn btn-primary">حفظ التغييرات</button>
                        <a href="{{ url_for('manage_graduates') }}" class="btn btn-secondary">إلغاء</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
